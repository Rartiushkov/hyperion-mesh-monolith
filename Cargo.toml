[package]
name = "radnet-morphic-kernel"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Prototype Morphic Functional Layer kernel for adaptive radio PHY configuration"

[features]
default = ["std"]
std = ["dep:serde", "dep:serde_json", "dep:sha2", "dep:blake2", "dep:rayon"]
embedded = []
embedded-hal-adapter = ["dep:embedded-hal", "embedded"]
stress-test = []

[lib]
name = "radnet_morphic_kernel"
path = "src/lib.rs"
crate-type = ["rlib"]

[dependencies]
heapless = "0.8"
raman-core = { path = "raman-core", default-features = false }
embedded-hal = { version = "1.0", optional = true }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
sha2 = { version = "0.10", optional = true }
blake2 = { version = "0.10", optional = true }
rayon = { version = "1.10", optional = true }
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.23", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"
secp256k1 = { version = "0.29", features = ["recovery"] }
sha3 = "0.10"
hex = "0.4"
core_affinity = "0.8"
sysinfo = "0.30"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-webpki-roots-no-provider", "blocking"] }
tonic = { version = "0.12", features = ["transport"] }
prost = "0.13"
axum = "0.7"
hmac = "0.12"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Threading"] }

[[bin]]
name = "radnet_tools"
path = "src/bin/radnet_tools.rs"
required-features = ["std"]

[[bin]]
name = "gplc_rt"
path = "src/bin/gplc_rt.rs"
required-features = ["std"]

[[bin]]
name = "bio_quantum_record"
path = "src/bin/bio_quantum_record.rs"
required-features = ["std"]

[[bin]]
name = "bio_quantum_hybrid_runner"
path = "src/bin/bio_quantum_hybrid_runner.rs"
required-features = ["std"]

[[bin]]
name = "hft_web3_bench"
path = "src/bin/hft_web3_bench.rs"
required-features = ["std"]

[[bin]]
name = "hft_web3_e2e_sim"
path = "src/bin/hft_web3_e2e_sim.rs"
required-features = ["std"]

[[bin]]
name = "hyperion_grpc_server"
path = "src/bin/hyperion_grpc_server.rs"
required-features = ["std"]

[[bin]]
name = "hyperion_grpc_smoke"
path = "src/bin/hyperion_grpc_smoke.rs"
required-features = ["std"]

[[bin]]
name = "hyperion_grpc_bench"
path = "src/bin/hyperion_grpc_bench.rs"
required-features = ["std"]

[[bin]]
name = "hyperion_card_webhook"
path = "src/bin/hyperion_card_webhook.rs"
required-features = ["std"]

[[bin]]
name = "hyperion_raw_ingress"
path = "src/bin/hyperion_raw_ingress.rs"
required-features = ["std"]

[[bin]]
name = "hyperion_unified_bench"
path = "src/bin/hyperion_unified_bench.rs"
required-features = ["std"]

[dev-dependencies]
pretty_assertions = "1.4"
criterion = "0.5"
tokio = { version = "1", features = ["full", "test-util"] }
proptest = "1.0"

[build-dependencies]
tonic-build = "0.12"
protoc-bin-vendored = "3"

[[bench]]
name = "morphic_bench"
harness = false
