name: quality-gate

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: riscv32imc-unknown-none-elf

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check quality gate script presence
        id: quality_gate
        shell: pwsh
        run: |
          if (Test-Path "tools/quality_gate.py") {
            "present=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          } else {
            "present=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            Write-Host "tools/quality_gate.py is absent in this repository; skipping legacy quality gate."
          }

      - name: Run Quality Gate
        if: steps.quality_gate.outputs.present == 'true'
        shell: pwsh
        run: |
          python tools/quality_gate.py --firmware-warning-budget 8
