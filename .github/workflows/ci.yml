name: Hyperion Mesh CI

on:
  push:
    branches: [main, master, feature/grpc-infrastructure-integration]
  pull_request:
    branches: [main, master, feature/grpc-infrastructure-integration]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake pkg-config libssl-dev protobuf-compiler

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy (non-blocking, informational only)
        run: cargo clippy --all-targets --all-features
        continue-on-error: true

      - name: Build release
        run: cargo build --release

      - name: Run tests
        run: cargo test --release --lib --bins

      - name: Upload backend artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hyperion-backend-linux-x64
          path: |
            target/release/hyperion_raw_ingress
            target/release/hyperion_unified_bench
            target/release/hyperion_grpc_server
            target/release/hyperion_grpc_smoke
            target/release/hyperion_card_webhook
            deploy/deploy_binary.sh
            deploy/hyperion-grpc.service
            deploy/hyperion-card-webhook.service
          retention-days: 7

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        run: npm run build

      - name: Upload frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: hyperion-frontend
          path: frontend/dist
          retention-days: 7
